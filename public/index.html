<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Spain Out</title>
    <style>
        body { background-color: #000000; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; }
        h1 { color: #ff0000; font-size: 3rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; max-width: 600px; margin: 20px auto; color: #cccccc; }
        .counter { font-size: 4rem; font-weight: bold; color: #ff0000; margin: 30px 0 10px 0; }
        .goal { color: #888888; font-size: 1rem; margin-bottom: 30px; }
        button { background-color: #ff0000; color: white; border: none; padding: 15px 40px; font-size: 1.5rem; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.2s; }
        button:hover { background-color: #cc0000; }
        button:disabled { background-color: #555555; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Kick Spain Out</h1>
    <p>Очевидно е, че съдиите подкрепят Испания. Защо останалата част от света да се състезава, когато победителят вече е ясен? Изхвърлете Испания и дайте на всички останали честен шанс!</p>
    <div class="counter" id="countLabel">0</div>
    <div class="goal">цел: 1,000,000 подписи</div>
    <button id="signBtn" onclick="signPetition()">Подпиши петицията</button>
    <script>
        fetch('/api/signatures')
            .then(res => res.json())
            .then(data => { document.getElementById('countLabel').innerText = data.count.toLocaleString(); });
        function signPetition() {
            const btn = document.getElementById('signBtn');
            btn.disabled = true;
            btn.innerText = "Благодарим ви за подписа!";
            fetch('/api/sign', { method: 'POST' })
                .then(res => res.json())
                .then(data => { document.getElementById('countLabel').innerText = data.count.toLocaleString(); });
        }
    </script>
</body>
</html>
